# Análisis de SonarQube (etapa "SonarQube" del Jenkinsfile). La URL del servidor y el token NO van
# aquí: los inyecta withSonarQubeEnv('sonarqube') desde las credenciales de Jenkins.
sonar.projectKey=ms-vacation
sonar.projectName=ms-vacation
sonar.sourceEncoding=UTF-8

sonar.sources=app
sonar.tests=spec

# Cobertura generada por `bundle exec rspec` en la etapa Test. El analizador de Ruby de SonarQube lee
# la salida del JSONFormatter de SimpleCov (reports/coverage.json, ver spec/coverage_helper.rb); el
# Cobertura XML (reports/coverage.xml) es el que publica Jenkins con recordCoverage.
sonar.ruby.coverage.reportPaths=reports/coverage.json

# Mismos archivos que SimpleCov excluye en spec/coverage_helper.rb (cableado y reintentos de conexión,
# sin reglas de negocio). Así el porcentaje de SonarQube coincide con el que mide SimpleCov.
sonar.coverage.exclusions=\
  app/bootstrap.rb,\
  app/infrastructure/observability/tracing.rb,\
  app/infrastructure/logging.rb,\
  app/infrastructure/messaging/connection.rb,\
  app/infrastructure/persistence/database.rb
